name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build on GitHub runners so your machine is never loaded.
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.check.outputs.run-build }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check for [Trigger]/[DEBUG] in latest commit message
        id: check
        run: |
          msg=$(git log -1 --format=%B)
          if echo "$msg" | grep -q "\[Trigger\]"; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Commit contains [Trigger] -> building + publishing release"
          elif echo "$msg" | grep -q "\[DEBUG\]"; then
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Commit contains [DEBUG] -> skipping APK build (Debug Compile Check covers it)"
          else
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No [Trigger]/[DEBUG] in commit: $msg -> skipping build"
          fi

  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run-build == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Run unit tests
        run: cd src/gradle-stuff && ./gradlew test --no-daemon

      - name: Compute next free release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable tags only: prereleases (networkingpatch) must not move the counter.
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v networkingpatch | sort -V | tail -1)
          if [ -z "$latest" ]; then
            # Last stable on the old repo was v1.100 — continue the line so the
            # in-app updater (numeric version compare) sees new releases as newer.
            latest="v1.100"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          next="v$major.$((minor + 1))"
          while gh release view "$next" >/dev/null 2>&1; do
            minor=$((minor + 1))
            next="v$major.$minor"
          done
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Check signing secret present
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EJAO_KEYSTORE_BASE64" ]; then
            echo "::error::EJAO_KEYSTORE_BASE64 secret is missing or empty. Add the 4 EJAO_* secrets under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Build release APK
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
          EJAO_KEY_ALIAS: ${{ secrets.EJAO_KEY_ALIAS }}
          EJAO_STORE_PASSWORD: ${{ secrets.EJAO_STORE_PASSWORD }}
          EJAO_KEY_PASSWORD: ${{ secrets.EJAO_KEY_PASSWORD }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          CODE=$((MAJOR * 10000 + MINOR))
          cd src/gradle-stuff && ./gradlew assembleRelease --no-daemon -PappVersion="$VER" -PversionCode="$CODE"

      - name: Rename APK to ejao.apk
        run: cp src/MobileApp-src/build/outputs/apk/release/app-release.apk src/MobileApp-src/build/outputs/apk/release/ejao.apk

      - name: Compute SHA256 checksum
        id: sha
        run: |
          cd src/MobileApp-src/build/outputs/apk/release
          HASH=$(sha256sum ejao.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  ejao.apk" > ejao.apk.sha256

      - name: Publish release (auto-incremented tag)
        if: needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sha.outputs.hash }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk.sha256 \
            --title "${{ steps.tag.outputs.tag }}" \
            --latest \
            --notes "Automatic build from commit ${{ github.sha }} | SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ejao-udp-bridge-apk
          path: src/MobileApp-src/build/outputs/apk/release/ejao.apk
          retention-days: 14
