name: Debug Compile Check

on:
  workflow_dispatch:
  push:
    branches: [main]

# 3-step flow: [DEBUG] push (or manual dispatch) -> gate -> compile
# -> issue + approval -> publish release.
# Push a commit whose message contains "[DEBUG]" to main to trigger a
# compile-only check (catches compile errors, uploads the APK as an artifact).
# On compile success it opens an approval Issue; comment to approve and the
# release job builds + publishes the next tag. Timeout: 5h per waiting job.

concurrency:
  group: debug-compile
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run-debug: ${{ steps.check.outputs.run-debug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check for [DEBUG] (push) or manual dispatch
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-debug=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -> running debug flow"
            exit 0
          fi
          msg=$(git log -1 --format=%B)
          if echo "$msg" | grep -q "\[DEBUG\]"; then
            echo "run-debug=true" >> "$GITHUB_OUTPUT"
            echo "Commit contains [DEBUG] -> running debug flow"
          else
            echo "run-debug=false" >> "$GITHUB_OUTPUT"
            echo "No [DEBUG] in commit -> skipping"
          fi

  compile:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run-debug == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Compile check (assembleDebug)
        id: build
        run: cd src/gradle-stuff && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        if: always()
        run: |
          if [ -f src/MobileApp-src/build/outputs/apk/debug/app-debug.apk ]; then
            cp src/MobileApp-src/build/outputs/apk/debug/app-debug.apk src/MobileApp-src/build/outputs/apk/debug/ejao-debug.apk
          fi

      - name: Upload APK (if built)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ejao-debug-apk
          path: src/MobileApp-src/build/outputs/apk/debug/ejao-debug.apk
          if-no-files-found: warn
          retention-days: 7

  await-approval:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 300
    steps:
      - uses: trstringer/manual-approval@v1
        timeout-minutes: 300
        with:
          secret: ${{ github.token }}
          approvers: Hushayo
          minimum-approvals: 1
          issue-title: "Ejao debug compile - confirm result"
          issue-body: "The debug compile finished. Check the run logs / artifacts, then comment to approve or deny. Approval publishes the next release. If no response within 5 hours this job times out."
          fail-on-denial: true

  publish:
    needs: await-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v5

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Compute next free release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --json tagName -q '.[].tagName' | grep -v networkingpatch | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="v1.100"
          fi
          major=$(echo "$latest" | sed 's/v\([0-9]*\)\..*/\1/')
          minor=$(echo "$latest" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          next="v$major.$((minor + 1))"
          while gh release view "$next" >/dev/null 2>&1; do
            minor=$((minor + 1))
            next="v$major.$minor"
          done
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Check signing secret present
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EJAO_KEYSTORE_BASE64" ]; then
            echo "::error::EJAO_KEYSTORE_BASE64 secret is missing or empty. Add the 4 EJAO_* secrets under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Build release APK
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
          EJAO_KEY_ALIAS: ${{ secrets.EJAO_KEY_ALIAS }}
          EJAO_STORE_PASSWORD: ${{ secrets.EJAO_STORE_PASSWORD }}
          EJAO_KEY_PASSWORD: ${{ secrets.EJAO_KEY_PASSWORD }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          CODE=$((MAJOR * 10000 + MINOR))
          cd src/gradle-stuff && ./gradlew assembleRelease --no-daemon -PappVersion="$VER" -PversionCode="$CODE"

      - name: Rename APK to ejao.apk
        run: cp src/MobileApp-src/build/outputs/apk/release/app-release.apk src/MobileApp-src/build/outputs/apk/release/ejao.apk

      - name: Compute SHA256 checksum
        id: sha
        run: |
          cd src/MobileApp-src/build/outputs/apk/release
          HASH=$(sha256sum ejao.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  ejao.apk" > ejao.apk.sha256

      - name: Publish release (auto-incremented tag)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sha.outputs.hash }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk.sha256 \
            --title "${{ steps.tag.outputs.tag }}" \
            --latest \
            --notes "Automatic build from commit ${{ github.sha }} | SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ejao-udp-bridge-apk
          path: src/MobileApp-src/build/outputs/apk/release/ejao.apk
          retention-days: 14
