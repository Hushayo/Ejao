name: Networking Patch Build

on:
  push:
    branches: [networkingpatch]
  workflow_dispatch:

# High-risk networking rewrites land here, NOT on main.
# A push to networkingpatch whose message contains [Trigger] builds a test
# APK and publishes it as a pre-release tagged v1.X-networkingpatch so beta
# users can install it without touching stable. Stable releases still only
# come from main + [Trigger].

concurrency:
  group: networkingpatch-build
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.check.outputs.run-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: networkingpatch
      - name: Check for [Trigger] in latest commit message
        id: check
        run: |
          msg=$(git log -1 --format=%B)
          if echo "$msg" | grep -q "\[Trigger\]"; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "Commit contains [Trigger] -> building + publishing beta pre-release"
          else
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "No [Trigger] in commit: $msg -> skipping beta build"
          fi

  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run-build == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: networkingpatch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x src/gradle-stuff/gradlew

      - name: Run unit tests
        run: cd src/gradle-stuff && ./gradlew test --no-daemon

      - name: Compute networking-patch tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Continue both lines: last stable was v1.100, last beta v1.108.
          # Beta minor = max(stable minor, beta minor) + 1 so the tag always
          # compares newer than anything the app may already have installed.
          stable=$(gh release list --json tagName -q '.[].tagName' | grep -v networkingpatch | sort -V | tail -1)
          if [ -z "$stable" ]; then
            stable="v1.100"
          fi
          beta=$(gh release list --json tagName -q '.[].tagName' | grep networkingpatch | sort -V | tail -1)
          if [ -z "$beta" ]; then
            beta="v1.108-networkingpatch"
          fi
          smin=$(echo "$stable" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          bmin=$(echo "$beta" | sed 's/v[0-9]*\.\([0-9]*\).*/\1/')
          minor=$smin
          if [ "$bmin" -gt "$minor" ]; then
            minor=$bmin
          fi
          minor=$((minor + 1))
          tag="v1.$minor-networkingpatch"
          version="1.$minor-networkingpatch"
          while gh release view "$tag" >/dev/null 2>&1; do
            minor=$((minor + 1))
            tag="v1.$minor-networkingpatch"
            version="1.$minor-networkingpatch"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Patch tag: $tag (app version $version)"

      - name: Check signing secret present
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EJAO_KEYSTORE_BASE64" ]; then
            echo "::error::EJAO_KEYSTORE_BASE64 secret is missing or empty. Add the 4 EJAO_* secrets under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Build release APK
        env:
          EJAO_KEYSTORE_BASE64: ${{ secrets.EJAO_KEYSTORE_BASE64 }}
          EJAO_KEY_ALIAS: ${{ secrets.EJAO_KEY_ALIAS }}
          EJAO_STORE_PASSWORD: ${{ secrets.EJAO_STORE_PASSWORD }}
          EJAO_KEY_PASSWORD: ${{ secrets.EJAO_KEY_PASSWORD }}
        run: |
          VER="${{ steps.tag.outputs.version }}"
          NUM=$(echo "$VER" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1 \2/')
          MAJOR=$(echo "$NUM" | cut -d' ' -f1)
          MINOR=$(echo "$NUM" | cut -d' ' -f2)
          CODE=$((MAJOR * 10000 + MINOR))
          cd src/gradle-stuff && ./gradlew assembleRelease --no-daemon -PappVersion="$VER" -PversionCode="$CODE"

      - name: Rename APK to ejao.apk
        run: cp src/MobileApp-src/build/outputs/apk/release/app-release.apk src/MobileApp-src/build/outputs/apk/release/ejao.apk

      - name: Compute SHA256 checksum
        id: sha
        run: |
          cd src/MobileApp-src/build/outputs/apk/release
          HASH=$(sha256sum ejao.apk | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  ejao.apk" > ejao.apk.sha256

      - name: Publish networking-patch pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sha.outputs.hash }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk \
            src/MobileApp-src/build/outputs/apk/release/ejao.apk.sha256 \
            --title "${{ steps.tag.outputs.version }} - Networking Patch (beta)" \
            --notes "Experimental networking rewrite from branch networkingpatch @ commit ${{ github.sha }} | App version ${{ steps.tag.outputs.version }} | SHA256: $SHA256 | For beta testers only - stable users stay on main releases." \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ejao-networkingpatch-apk
          path: src/MobileApp-src/build/outputs/apk/release/ejao.apk
          retention-days: 14
